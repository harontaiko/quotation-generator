name: Lint workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject actions not pinned to a full commit SHA
        run: |
          if grep -RInE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^#[:space:]]+@' .github/workflows/ \
              | grep -vE 'uses:[[:space:]]*[^@#[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' \
              | grep -vE 'uses:[[:space:]]*(\./|docker://)'; then
            echo "Found action refs not pinned to a full 40-character commit SHA."
            exit 1
          fi

      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
